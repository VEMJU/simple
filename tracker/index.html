<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple: hair plan and tracker</title>
<script>
  // Pick the theme before first paint: saved choice, else the system setting.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var system = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : system;
    // "on" = play the how-to animations even when the device asks for reduced motion
    try { if (localStorage.getItem('motion') === 'on') document.documentElement.dataset.motion = 'on'; } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top glass">
  <span class="brand">Simple<b>.</b></span>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch between light and dark">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<main>
  <!-- Hair plan: rendered from js/plan-data.js -->
  <section class="view" id="view-plan" aria-label="Hair plan"></section>

  <!-- Watch list: the "check this later" notes from the plan -->
  <section class="view" id="view-watch" aria-label="Watch list" hidden></section>

  <!-- Tracker: plans, decisions, facts -->
  <section class="view" id="view-tracker" aria-label="Tracker" hidden>
    <div class="hero">
      <p class="eyebrow">Plans, decisions, facts</p>
      <h1>Keep <em>track.</em></h1>
    </div>
    <div class="t-head">
      <div class="t-review" id="review"><span id="reviewText"></span><button class="btn small" id="reviewBtn" type="button">Review done</button></div>
    </div>
    <div class="seg glass" id="tSeg" role="tablist" aria-label="Tracker sections">
      <button type="button" data-sec="plans">Plans</button>
      <button type="button" data-sec="decisions">Decisions</button>
      <button type="button" data-sec="facts">Facts</button>
      <button type="button" data-sec="archive">Archive</button>
    </div>
    <label class="sr-only" for="search">Search everything</label>
    <input class="field" id="search" type="search" placeholder="Search everything" autocomplete="off">
    <form class="form-card glass" id="add">
      <label class="sr-only" for="title">Title</label>
      <input class="field" id="title" placeholder="Title" required maxlength="200">
      <label class="sr-only" for="note">Details</label>
      <textarea class="field" id="note" placeholder="Details. For a decision, write the why."></textarea>
      <div class="row">
        <button class="btn primary" type="submit" id="submitBtn">Add</button>
        <button class="btn" type="button" id="cancelBtn" hidden>Cancel</button>
      </div>
    </form>
    <ul class="entries" id="list"></ul>
    <div class="t-foot">
      <button class="btn small" id="export" type="button">Export JSON</button>
      <label class="btn small">Import JSON <input id="import" type="file" accept="application/json" hidden></label>
    </div>
  </section>
</main>

<nav class="tabs glass" aria-label="Views">
  <span class="lens" aria-hidden="true"></span>
  <button type="button" data-view="plan">Hair plan</button>
  <button type="button" data-view="watch">Watch list</button>
  <button type="button" data-view="tracker">Tracker</button>
</nav>

<script src="js/plan-data.js"></script>
<script src="js/scenes.js"></script>
<script src="js/scenes/shampoo.js"></script>
<script src="js/scenes/rinse.js"></script>
<script src="js/scenes/condition.js"></script>
<script src="js/scenes/blot.js"></script>
<script src="js/scenes/cream.js"></script>
<script src="js/scenes/scrunch.js"></script>
<script src="js/scenes/fringe.js"></script>
<script src="js/scenes/sides.js"></script>
<script src="js/scenes/dry.js"></script>
<script src="js/scenes/cast.js"></script>
<script src="js/scenes/refresh.js"></script>
<script src="js/scenes/sleep.js"></script>
<script src="js/scenes/amounts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
